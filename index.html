<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Demo RTS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ui:#1b1712e6;--line:#6b5a3e;--txt:#f1e6cf;--acc:#e0b154}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:system-ui,"Segoe UI",sans-serif;color:var(--txt);user-select:none}
canvas#view{display:block}
body.amove canvas#view{cursor:crosshair}
.panel{background:var(--ui);border:1px solid var(--line);border-radius:6px}
#topbar{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:18px;padding:6px 16px;font-size:14px;white-space:nowrap}
#topbar b{color:var(--acc);font-weight:600}
#miniwrap{position:fixed;right:12px;bottom:12px;width:270px;height:270px;display:flex;align-items:center;justify-content:center;pointer-events:none}
#minimap{width:190px;height:190px;transform:rotate(45deg);image-rendering:pixelated;cursor:pointer;border:2px solid var(--line);pointer-events:auto}
#debug{position:fixed;left:10px;top:52px;pointer-events:none;padding:8px 10px;font:12px/1.55 ui-monospace,Consolas,monospace;min-width:250px}
#selinfo{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);padding:10px 16px;font-size:14px;min-width:320px;max-width:44vw;line-height:1.6;pointer-events:none}
#selinfo:empty{display:none}
#selinfo h3{margin:0 0 2px;color:var(--acc);font-size:16px}
#selbox{position:fixed;border:1px solid #fff;background:#ffffff1a;pointer-events:none}
#hint{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);padding:4px 12px;font-size:13px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#menu{background:radial-gradient(#2a2216,#0c0a07)}
#pause{background:#000b}
.box{padding:28px 32px;min-width:360px;display:flex;flex-direction:column;gap:12px}
h1{margin:0 0 6px;color:var(--acc);letter-spacing:1px}
h2{margin:0;color:var(--acc);font-size:20px}
button{font:inherit;padding:9px 14px;background:#3a2f20;color:var(--txt);border:1px solid var(--line);border-radius:4px;cursor:pointer}
button:hover:not(:disabled){background:#4d3e29}
button:disabled{opacity:.45;cursor:not-allowed}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
input,select{font:inherit;background:#120f0a;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:5px 8px;width:160px}
.hidden{display:none!important}
#keys{font-size:14px;line-height:1.75;margin:0;padding-left:18px;columns:2;column-gap:28px}
#pause .box{max-width:760px}
.ok{color:#7ddc7d}.ko{color:#ef6b6b}
#lobby{background:radial-gradient(#2a2216,#0c0a07)}
#slots div{padding:4px 8px;border-left:4px solid;margin:3px 0;background:#0003}
#chat{position:fixed;left:12px;bottom:170px;width:340px;z-index:5;pointer-events:none;font-size:13px}
#chatlog div{background:#000a;padding:2px 6px;margin-top:2px;border-radius:3px}
#chatin{width:100%;pointer-events:auto;margin-top:4px}
#cmd{position:fixed;left:12px;bottom:12px;padding:8px;display:grid;grid-template-columns:repeat(3,92px);gap:6px}
#cmd:empty{display:none}
#cmd button{padding:5px 4px;font-size:12px;line-height:1.25;display:flex;flex-direction:column;align-items:center}
#cmd button small{opacity:.8;font-size:10.5px}
#cmd .q{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;font-size:12px}
#cmd .q button{flex-direction:row;gap:4px}
.bar{height:5px;background:#300;margin-top:3px}.bar i{display:block;height:100%;background:#3ee05a}
</style>
</head>

const RES = ['food', 'wood', 'stone', 'metal', 'gold'];

let LOCAL_PLAYER = 0;          // slot del giocatore su questo browser (cambia in multiplayer)
const T = { GRASS:0, WATER:1, FORD:2, TREE:3, STONE:4, METAL:5, GOLD:6 };
const T_KEY = ['t_grass','t_water','t_ford','t_tree','t_stone','t_metal','t_gold'];
const T_COLOR = [[86,128,58],[44,98,150],[96,140,160],[44,88,40],[128,128,124],[92,96,112],[212,175,55]];
const TILE_RES = { [T.TREE]: 'wood', [T.STONE]: 'stone', [T.METAL]: 'metal', [T.GOLD]: 'gold' };
const GATHER_RATE = { food: .8, wood: .6, stone: .45, metal: .45, gold: .4 };   // unità/s
const BASES = [

// Statistiche unità (distanze in celle, tempi in secondi)

  guardaboschi:{ size: 2, hp: 300, cost: { wood: 120, gold: 20 }, time: 20, forest: true, key: 'KeyG', color: 0x6f8f4e },
  caserma:     { size: 3, hp: 900, cost: { wood: 150 }, time: 30, train: ['fante', 'lanciere'], key: 'KeyK', color: 0xb59a7a },
  arcieria:    { size: 3, hp: 900, cost: { wood: 150 }, time: 30, train: ['arciere'], key: 'KeyR', color: 0xa8916c },
  scuderia:    { size: 3, hp: 900, cost: { wood: 150, stone: 50 }, time: 30, train: ['cavaliere'], key: 'KeyU', color: 0x9b8566 },
};
const BUILD_LIST = Object.keys(BLD).filter(k => BLD[k].key);
const TRAIN_KEYS = ['KeyQ', 'KeyW', 'KeyE'];
// Contro-tipi: lancieri > cavalleria > arcieri > fanteria > lancieri
const BONUS = { spear: { cav: 2.5 }, cav: { arch: 2 }, arch: { inf: 1.6 }, inf: { spear: 1.6 } };

/* ================= I18N ================= */
const STR = {
  it: { title:'Demo RTS', solo:'Partita in solo', host:'Crea partita', join:'Unisciti', soon:'(in arrivo)',
    seed:'Seed mappa', lang:'Lingua', food:'Cibo', wood:'Legno', stone:'Pietra', metal:'Metallo', gold:'Oro',

    k_ping:'Alt + click destro: ping', k_home:'H: centra sulla base', k_mini:'Click minimappa: sposta camera', k_esc:'Esc: pausa e comandi',
    h_amove:'Attacco-movimento: click sinistro sul punto (Esc annulla)',
    cell:'Cella', terrain:'Terreno', libs:'Librerie', ents:'Entità', units:'Unità',
    hp:'PV', atk:'Attacco', armor:'Armatura', range:'Gittata', enemy:'Nemico',
    u_popolano:'Popolano', u_fante:'Fante', u_lanciere:'Lanciere', u_arciere:'Arciere', u_cavaliere:'Cavaliere',
    t_grass:'Prato', t_water:'Fiume', t_ford:'Guado', t_tree:'Foresta', t_stone:'Pietra', t_metal:'Metallo', t_gold:'Oro',
    b_cc:'Centro Città', b_casa:'Casa', b_fattoria:'Fattoria', b_mulino:'Mulino', b_segheria:'Segheria', b_miniera:'Accampamento minerario',
    b_guardaboschi:'Guardaboschi', b_caserma:'Caserma', b_arcieria:'Arcieria', b_scuderia:'Scuderia',
    k_build:'B + lettera: costruisci (popolani)', k_gather:'Click destro su risorsa/cantiere: raccogli/costruisci', k_idle:'. (punto): popolano inattivo',
    k_train:'Q W E: addestra (edificio selezionato) · click destro: punto di raccolta',
    h_place:'Click sinistro: piazza · Shift: piazza altri · Esc/click destro: annulla', h_build:'Costruisci: premi la lettera dell\'edificio (Esc annulla)',
    building:'In costruzione', carry:'Trasporta', queue:'Coda', popmax:'Popolazione al massimo!', nores:'Risorse insufficienti', worker:'Contadino', drop:'Deposito',
    name:'Nome', lobby:'Lobby', code:'codice', startgame:'Avvia partita', leave:'Esci', slot_cpu:'CPU', you:'tu', host_tag:'host',
    connecting:'Connessione…', e_conn:'Connessione fallita', e_full:'Partita piena o già iniziata', e_hostgone:'L\'host si è disconnesso',
    left:'si è disconnesso, lo slot passa alla CPU', joined:'è entrato', hostpause:'Pausa dell\'host', k_chat:'Invio: chat di squadra · Alt+click minimappa: ping', waithost:'In attesa dell\'host…',
    diff:'Difficoltà CPU', easy:'Facile', normal:'Normale', hard:'Difficile', victory:'🏆 Vittoria! Il Centro Città nemico è caduto', defeat:'💀 Sconfitta: il vostro Centro Città è caduto' },
  en: { title:'RTS Demo', solo:'Solo game', host:'Host game', join:'Join', soon:'(coming soon)',
    seed:'Map seed', lang:'Language', food:'Food', wood:'Wood', stone:'Stone', metal:'Metal', gold:'Gold',
    pop:'Pop', controls:'Controls', start:'Start / Resume', toMenu:'Main menu',
    k_sel:'Left click: select', k_box:'Drag: box select', k_shift:'Shift+click: add/remove',
    k_dbl:'Double click: all of same type', k_right:'Right click: move / attack',
    k_amove:'A + click: attack-move', k_stop:'S: stop', k_groups:'Ctrl+1..9 set group, 1..9 recall (x2 centers)',
    k_del:'Delete: kill unit', k_pan:'Arrows / screen edges: move camera', k_zoom:'Wheel: zoom',
    k_ping:'Alt + right click: ping', k_home:'H: center on base', k_mini:'Click minimap: move camera', k_esc:'Esc: pause and controls',
    h_amove:'Attack-move: left click a point (Esc cancels)',
    cell:'Cell', terrain:'Terrain', libs:'Libraries', ents:'Entities', units:'Units',
    hp:'HP', atk:'Attack', armor:'Armor', range:'Range', enemy:'Enemy',
    u_popolano:'Villager', u_fante:'Footman', u_lanciere:'Spearman', u_arciere:'Archer', u_cavaliere:'Knight',
    t_grass:'Grass', t_water:'River', t_ford:'Ford', t_tree:'Forest', t_stone:'Stone', t_metal:'Metal', t_gold:'Gold',
    b_cc:'Town Center', b_casa:'House', b_fattoria:'Farm', b_mulino:'Mill', b_segheria:'Lumber Camp', b_miniera:'Mining Camp',
    b_guardaboschi:'Forester', b_caserma:'Barracks', b_arcieria:'Archery Range', b_scuderia:'Stable',

    name:'Name', lobby:'Lobby', code:'code', startgame:'Start game', leave:'Leave', slot_cpu:'CPU', you:'you', host_tag:'host',

};
let lang = localStorage.getItem('rts_lang') || 'it';
const t = k => STR[lang][k] ?? k;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
}

/* ================= RNG + NOISE ================= */
function hashSeed(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a);
  x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(rng) {
  const N = 256, p = new Float32Array(N * N); for (let i = 0; i < p.length; i++) p[i] = rng();
  const sm = v => v * v * (3 - 2 * v), g = (a, b) => p[(b & 255) * N + (a & 255)];
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi);
    const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf; };
}
const fbm = (n, x, y) => (n(x, y) * .5 + n(x * 2, y * 2) * .25 + n(x * 4, y * 4) * .125 + n(x * 8, y * 8) * .0625) / .9375;

/* ================= MAPPA (simmetria centrale) ================= */
function generateMap(seed) {
  const M = CFG.MAP, rng = mulberry32(hashSeed(seed)), noise = makeNoise(rng);
  const tile = new Uint8Array(M * M), amount = new Uint16Array(M * M), shade = new Float32Array(M * M);
  const idx = (x, z) => z * M + x;
  const a1 = 3 + rng() * 3, a2 = 1 + rng() * 2;
  const FORDS = [0, -60, 60];
  const distBase = (x, z) => Math.min(...BASES.map(b => Math.hypot(x - b.x, z - b.z)));
  const riverD = (x, z) => { const d = (x + z - (M - 1)) / Math.SQRT2, s = (x - z) / Math.SQRT2;
    return { r: Math.abs(d - (Math.sin(s * .055) * a1 + Math.sin(s * .13) * a2)), s }; };

  for (let z = 0; z < M; z++) for (let x = 0; x < M; x++) {
    const i = idx(x, z), n = fbm(noise, x * .045, z * .045);
    shade[i] = fbm(noise, x * .2 + 50, z * .2 + 50);
    const { r, s } = riverD(x, z);
    if (r < 3.2) { tile[i] = FORDS.some(f => Math.abs(s - f) < 4.5) ? T.FORD : T.WATER; continue; }
    if (distBase(x, z) < 15 || r < 5) continue;
    if (n > .6) { tile[i] = T.TREE; amount[i] = 100; }
  }
  const cluster = (cx, cz, type, count, amt) => {
    let x = Math.round(cx), z = Math.round(cz);
    for (let k = 0, guard = 0; k < count && guard < count * 20; guard++) {
      if (x > 1 && z > 1 && x < M - 2 && z < M / 2 - 2 && tile[idx(x, z)] === T.GRASS && distBase(x, z) > 6) {
        tile[idx(x, z)] = type; amount[idx(x, z)] = amt; k++;
      }
      x += Math.round(rng() * 2 - 1); z += Math.round(rng() * 2 - 1);
    }
  };
  const b = BASES[0];
  const around = (r, ang) => [b.x + Math.cos(ang) * r, b.z + Math.sin(ang) * r];
  [[T.STONE, 7, 350], [T.METAL, 7, 300], [T.GOLD, 6, 300]].forEach(([ty, c, a], k) =>
    cluster(...around(20 + rng() * 4, (k * .5 + .1 + rng() * .3) * Math.PI / 2 * 1.3), ty, c, a));
  for (let k = 0; k < 3; k++) cluster(...around(19 + rng() * 6, rng() * Math.PI / 2), T.TREE, 40, 100);

// Ogni azione (locale, rete, IA) passa da qui. In M4 i client invieranno questi oggetti all'host.
const owned = (c) => (c.units || []).filter(e => alive(e) && world.get(e, 'Owner').player === c.player);

  const sorted = [...units].sort((a, b) => a - b);
  sorted.forEach((e, i) => {
    const cx = (i % cols) - (cols - 1) / 2, cz = Math.floor(i / cols) - (Math.ceil(n / cols) - 1) / 2;
    const ox = (cx - cz) * sp * .7071, oz = (cx + cz) * sp * .7071;      // allineata alla vista iso

    out.push([e, tx, tz]);

  return out;
}
const Commands = {

  handlers: {

    move(w, c) {
      const us = owned(c);   // il gruppo marcia alla velocità del più lento
      const vmax = us.length > 1 ? Math.min(...us.map(e => UNITS[w.get(e, 'Unit').type].speed)) : undefined;
      for (const [e, x, z] of formation(us, c.x, c.z)) setOrder(e, { type: c.amove ? 'amove' : 'move', x, z, vmax });
    },
    attack(w, c) { if (!hittable(c.target)) return; for (const e of owned(c)) setOrder(e, { type: 'attack', target: c.target }); },
    stop(w, c) { for (const e of owned(c)) setOrder(e, { type: 'idle' }); },
    kill(w, c) { for (const e of owned(c)) killUnit(e); },
    // villagers: solo popolani del giocatore
    build(w, c) {

      pay(team, d.cost);

    construct(w, c) { const b = w.get(c.target, 'Bld'); if (b && TEAM_OF[w.get(c.target, 'Owner').player] === TEAM_OF[c.player]) for (const e of villagers(c)) setOrder(e, { type: 'build', target: c.target }); },
    gather(w, c) {

    train(w, c) {

      if (!canPay(team, UNITS[c.unit].cost)) return;

  },

function buildMapScene(m) {

  for (let z = 0; z < M; z++) for (let x = 0; x < M; x++) {
    const i = m.idx(x, z), ty = m.tile[i], base = (ty === T.TREE || ty >= T.STONE) ? T_COLOR[T.GRASS] : T_COLOR[ty];
    const k = .85 + m.shade[i] * .3, o = ((M - 1 - z) * M + x) * 4;

  }

    const ty = m.tile[m.idx(x, z)];
    if (ty === T.TREE) trees.push([x + .5 + (rng() - .5) * .5, z + .5 + (rng() - .5) * .5, .8 + rng() * .5]);

  trunk.count = crown.count = cap;
  for (let i = 0; i < cap; i++) setTree(i, 0, 0, 0);
  trees.forEach(([x, z, s]) => { const i = deco.used++; deco.treeSlot[Math.floor(z) * M + Math.floor(x)] = i; setTree(i, x, z, s); });
  for (let i = deco.used; i < cap; i++) deco.free.push(i);
  mapGroup.add(trunk, crown);
  const rockMesh = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(.42, 0), new THREE.MeshLambertMaterial({ flatShading: true }), Math.max(1, rocks.length));
  const col = new THREE.Color();
  rocks.forEach(([x, z, ty, r], i) => {
    dummy.position.set(x, .2, z); dummy.rotation.set(r * 3, r * 7, r * 5); dummy.scale.set(1, .7 + r * .4, 1); dummy.updateMatrix();
    rockMesh.setMatrixAt(i, dummy.matrix); col.setRGB(...T_COLOR[ty].map(v => v / 255)).convertSRGBToLinear(); rockMesh.setColorAt(i, col);
    deco.rockSlot[Math.floor(z) * M + Math.floor(x)] = i;

  mapGroup.add(rockMesh);

}
let deco = null;
const dummy = new THREE.Object3D();
function setTree(i, x, z, s) {
  dummy.position.set(x, .3 * s, z); dummy.scale.setScalar(s); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); deco.trunk.setMatrixAt(i, dummy.matrix);
  dummy.position.y = 1.1 * s; dummy.rotation.y = s * 9; dummy.updateMatrix(); deco.crown.setMatrixAt(i, dummy.matrix);
  deco.trunk.instanceMatrix.needsUpdate = deco.crown.instanceMatrix.needsUpdate = true;
}
// applica i cambi di celle (alberi tagliati/cresciuti, rocce esaurite) a scena e minimappa
function syncTerrain() {
  const M = map.M;
  for (const c of map.dirty) {
    const x = c % M, z = Math.floor(c / M), ty = map.tile[c];
    let slot = deco.treeSlot[c];
    if (ty === T.TREE) { if (slot < 0 && deco.free.length) slot = deco.treeSlot[c] = deco.free.pop(); if (slot >= 0) setTree(slot, x + .5, z + .5, .8 + deco.rng() * .5); }
    else if (slot >= 0 && !map.saplings.has(c)) { setTree(slot, 0, 0, 0); deco.free.push(slot); deco.treeSlot[c] = -1; }
    const rs = deco.rockSlot[c];
    if (rs >= 0 && ty === T.GRASS) { dummy.scale.setScalar(0); dummy.updateMatrix(); deco.rock.setMatrixAt(rs, dummy.matrix); deco.rock.instanceMatrix.needsUpdate = true; deco.rockSlot[c] = -1; }
    const cc = T_COLOR[ty], k = .85 + map.shade[c] * .3; miniBase.data.set([cc[0] * k, cc[1] * k, cc[2] * k, 255], c * 4);
  }
  map.dirty.length = 0;
  for (const [c, g] of map.saplings) {
    let slot = deco.treeSlot[c];
    if (slot < 0) { if (!deco.free.length) continue; slot = deco.treeSlot[c] = deco.free.pop(); }
    setTree(slot, c % M + .5, Math.floor(c / M) + .5, .25 + g * .6);
  }
}

    for (let k = 0; k < 4; k++) box(s - .5, .14, .18, mat(0xc9b04a), 0, .1, -s / 2 + .55 + k * (s - 1.1) / 3);
    box(.3, .5, .3, pc, s / 2 - .3, .25, s / 2 - .3);

    const b = world.get(sb, 'Bld');
    html = BLD[b.type].train.map((u, i) => `<button data-train="${u}" ${canPay(team, UNITS[u].cost) && b.queue.length < 5 ? '' : 'disabled'}>${t('u_' + u)} (${keyName(TRAIN_KEYS[i])})<small>${costTxt(UNITS[u].cost)}</small></button>`).join('');
    if (b.queue.length) html += `<div class="q">${b.queue.map((q, i) => `<button data-cancel="${i}" title="✕">${t('u_' + q.unit)}${i ? '' : ` ${Math.floor(q.t / UNITS[q.unit].time * 100)}%`}</button>`).join('')}</div>`;
  } else if (!sb && myVillagers().length) {
    html = BUILD_LIST.map(k => `<button data-build="${k}" ${canPay(team, BLD[k].cost) ? '' : 'disabled'}>${t('b_' + k)} (${keyName(BLD[k].key)})<small>${costTxt(BLD[k].cost)}</small></button>`).join('');
  }
  if (html !== cmdKey) { $('cmd').innerHTML = html; cmdKey = html; }
}
$('cmd').addEventListener('mousedown', e => {
  e.stopPropagation(); const bt = e.target.closest('button'); if (!bt || bt.disabled) return;
  const sb = selBld();
  if (bt.dataset.build) startPlacing(bt.dataset.build);
  else if (bt.dataset.train) train(bt.dataset.train);
  else if (bt.dataset.cancel && sb) Commands.issue({ type: 'cancel', player: LOCAL_PLAYER, bld: sb, i: +bt.dataset.cancel });
});

/* ================= RETE (PeerJS, host autoritativo) ================= */
// Host: simula tutto, riceve comandi, invia delta 10/s su canale affidabile e ordinato (il delta si basa sull'ultimo invio).
// Client: niente simulazione, applica gli snapshot e interpola.
const SNAP_EVERY = 2;
const net = { role: 'solo', peer: null, conns: [], host: null, slots: [], seed: '', code: '', lastSent: new Map(), cells: [], sapKey: '', resKey: '', snapT: 0, hostPaused: false };
const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => CODE_CH[b % CODE_CH.length]).join('');
const myName = () => $('pname').value.trim().slice(0, 16) || 'Player';
const menuMsg = k => $('menumsg').textContent = k ? t(k) : '';
const netSend = m => net.conns.forEach(c => c.open && c.send(m));
function netReset() {
  net.peer?.destroy();
  Object.assign(net, { role: 'solo', peer: null, conns: [], host: null, slots: [], lastSent: new Map(), cells: [], sapKey: '', resKey: '', hostPaused: false });
  $('chatlog').innerHTML = '';
}
function endGame(reason) {
  netReset(); state = 'menu'; setPaused(false); stopPlacing();
  ['hud', 'lobby'].forEach(id => $(id).classList.add('hidden')); $('menu').classList.remove('hidden'); menuMsg(reason);
}
function hostGame(tries = 0) {
  netReset(); menuMsg('connecting');
  const code = newCode(), peer = net.peer = new Peer('rtsdemo-' + code);
  peer.on('open', () => {
    Object.assign(net, { role: 'host', code, slots: [myName(), null, null], seed: $('seed').value || 'demo' });
    LOCAL_PLAYER = 0; menuMsg(null); showLobby();
  });
  peer.on('error', err => { if (err.type === 'unavailable-id' && tries < 3) hostGame(tries + 1); else if (state !== 'game') menuMsg('e_conn'); });
  peer.on('connection', conn => { conn.on('data', m => hostOnData(conn, m)); conn.on('close', () => hostOnClose(conn)); });
}
// trust boundary: tutto ciò che arriva dai client è da validare
const NUM_KEYS = ['x', 'z', 'x0', 'z0', 'i', 'target', 'farm', 'cell'];   // bld è id o nome edificio: gli handler lo controllano
function sanitizeCmd(c) {
  if (!c || typeof c !== 'object' || !Object.hasOwn(Commands.handlers, c.type)) return null;
  if (NUM_KEYS.some(k => k in c && !Number.isFinite(c[k]))) return null;
  c.units = Array.isArray(c.units) ? c.units.filter(Number.isInteger).slice(0, 200) : [];
  return c;
}
function hostOnData(conn, m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 'hello' && conn.slot === undefined) {
    const slot = net.slots.findIndex((n, i) => i > 0 && !n);
    if (state !== 'lobby' || slot < 0) { conn.send({ t: 'end', reason: 'e_full' }); setTimeout(() => conn.close(), 500); return; }
    conn.slot = slot; net.slots[slot] = String(m.name || '?').slice(0, 16); net.conns.push(conn);
    sysChat(net.slots[slot] + ' ' + t('joined')); lobbyBroadcast();
  } else if (conn.slot === undefined) return;
  else if (m.t === 'cmd') { const c = sanitizeCmd(m.c); if (c) { c.player = conn.slot; Commands.queue.push(c); } }
  else if (m.t === 'chat') chatAll(net.slots[conn.slot] ?? '?', m.text, conn.slot);
}
function hostOnClose(conn) {
  if (conn.slot === undefined || !net.conns.includes(conn)) return;
  net.conns = net.conns.filter(c => c !== conn);
  const name = net.slots[conn.slot]; net.slots[conn.slot] = null;   // lo slot passa alla CPU, non si riprende
  if (state === 'game') world.humans[conn.slot] = false;
  sysChat(name + ' ' + t('left'));
  if (state === 'lobby') lobbyBroadcast();
}
function lobbyBroadcast() { net.conns.forEach(c => c.send({ t: 'lobby', code: net.code, slots: net.slots, seed: net.seed, you: c.slot })); renderLobby(); }
function joinGame(code) {
  code = String(code).toUpperCase().trim();
  netReset(); if (!/^[A-Z0-9]{6}$/.test(code)) return menuMsg('e_conn');
  menuMsg('connecting');
  const peer = net.peer = new Peer();
  peer.on('open', () => {
    const conn = net.host = peer.connect('rtsdemo-' + code, { reliable: true, serialization: 'json' });
    conn.on('open', () => { net.role = 'client'; conn.send({ t: 'hello', name: myName() }); });
    conn.on('data', clientOnData);
    conn.on('close', () => { if (net.role === 'client') endGame('e_hostgone'); });
  });
  peer.on('error', () => { if (net.role !== 'client') menuMsg('e_conn'); else endGame('e_hostgone'); });
}
function clientOnData(m) {
  if (m.t === 'lobby') { Object.assign(net, { slots: m.slots, code: m.code, seed: m.seed }); LOCAL_PLAYER = m.you; menuMsg(null); showLobby(); }
  else if (m.t === 'start') { LOCAL_PLAYER = m.you; net.hostPaused = true; startGame(m.seed, m.slots.map(Boolean)); }
  else if (m.t === 'snap') applySnap(m);
  else if (m.t === 'pause') net.hostPaused = m.v;
  else if (m.t === 'chat') addChat(m.name, m.text, m.player);
  else if (m.t === 'end') endGame(m.reason);
}
function showLobby() { state = 'lobby'; $('menu').classList.add('hidden'); $('lobby').classList.remove('hidden'); renderLobby(); }
function renderLobby() {
  $('lobbycode').textContent = net.code; $('slots').innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div'), nm = i < 3 ? net.slots[i] : null;
    d.style.borderColor = hex(PLAYER_COLORS[i]);
    d.textContent = `${i < 3 ? '⚔' : '☠'} ${nm ?? t('slot_cpu')}${i === LOCAL_PLAYER ? ` (${t('you')})` : ''}${i === 0 && nm ? ` — ${t('host_tag')}` : ''}`;
    $('slots').append(d);
  }
  if (net.role === 'host') {
    if (!$('lseed')) { $('lobbyseed').innerHTML = `<label>${t('seed')}<input id="lseed"></label>`; $('lseed').value = net.seed;
      $('lseed').onchange = () => { net.seed = $('lseed').value || 'demo'; lobbyBroadcast(); }; }
  } else $('lobbyseed').textContent = `${t('seed')}: ${net.seed}`;
  $('btn-start').classList.toggle('hidden', net.role !== 'host');
}
// chat: testo sempre via textContent (mai HTML dai peer)
function addChat(name, text, player) {
  const d = document.createElement('div'), n = document.createElement('b');
  if (name) { n.textContent = name + ': '; n.style.color = hex(PLAYER_COLORS[player] ?? 0xffffff); d.append(n); }
  d.append(String(text).slice(0, 120)); $('chatlog').append(d);
  while ($('chatlog').children.length > 8) $('chatlog').firstChild.remove();
  setTimeout(() => d.remove(), 20000);
}
function chatAll(name, text, player) { text = String(text ?? '').slice(0, 120); addChat(name, text, player); netSend({ t: 'chat', name, text, player }); }
const sysChat = text => chatAll('', text, -1);
function sendChat(text) {
  text = text.trim(); if (!text) return;
  if (net.role === 'client') net.host.send({ t: 'chat', text }); else chatAll(myName(), text, LOCAL_PLAYER);
}
const r2 = v => Math.round(v * 100) / 100;
function encodeEnt(e) {
  const w = world, pl = w.get(e, 'Owner')?.player, u = w.get(e, 'Unit'), b = w.get(e, 'Bld'), pr = w.get(e, 'Proj'), g = w.get(e, 'Ping');
  if (u) { const p = w.get(e, 'Pos'); return ['u', u.type, pl, r2(p.x), r2(p.z), r2(p.face), Math.ceil(u.hp), u.carry || 0, u.carryRes || 0, u.attackAnim ?? -99, u.order.type, u.order.farm ?? u.order.back?.farm ?? 0]; }
  if (b) return ['b', b.type, pl, b.x0, b.z0, b.done ? 1 : 0, r2(b.progress), Math.ceil(b.hp), b.queue.map(q => [q.unit, q.player, Math.floor(q.t * 10) / 10, q.blocked ? 1 : 0]), b.rally, b.worker];
  if (pr) return ['p', r2(pr.x), r2(pr.z), r2(pr.tx), r2(pr.tz)];
  const p = w.get(e, 'Pos'); return ['g', pl, r2(p.x), r2(p.z), g.ttl, g.max];
}
// shortcut: le unità in movimento si reinviano intere a ogni snapshot (~60 B l'una); se la banda non basta, quantizzare in binario
function netBroadcast() {
  const ch = [], seen = new Set();
  for (const name of ['Bld', 'Unit', 'Proj', 'Ping']) for (const e of world.query(name)) {
    const a = encodeEnt(e), s = JSON.stringify(a); seen.add(e);
    if (net.lastSent.get(e) !== s) { net.lastSent.set(e, s); ch.push([e, ...a]); }
  }
  const rm = []; for (const e of net.lastSent.keys()) if (!seen.has(e)) { rm.push(e); net.lastSent.delete(e); }
  const msg = { t: 'snap', tick: world.tick, ch, rm, over: world.over };
  const rs = JSON.stringify(world.res); if (rs !== net.resKey) { net.resKey = rs; msg.res = world.res; }
  if (net.cells.length) { msg.cells = net.cells; net.cells = []; }
  const sp = JSON.stringify([...map.saplings]); if (sp !== net.sapKey) { net.sapKey = sp; msg.sap = [...map.saplings]; }
  netSend(msg);
}
function applySnap(m) {
  if (state !== 'game') return;
  const w = world;
  for (const e of w.query('Pos')) { const p = w.get(e, 'Pos'); p.px = p.x; p.pz = p.z; }
  for (const e of w.query('Proj')) { const p = w.get(e, 'Proj'); p.px = p.x; p.pz = p.z; }
  for (const [e, k, ...a] of m.ch) {
    if (k === 'u') {
      const [type, player, x, z, face, hp, carry, carryRes, attackAnim, otype, farm] = a;
      if (!w.has(e, 'Unit')) { w.add(e, 'Pos', { x, z, px: x, pz: z }); w.add(e, 'Owner', { player }); w.add(e, 'Unit', { type }); }
      Object.assign(w.get(e, 'Pos'), { x, z, face });
      Object.assign(w.get(e, 'Unit'), { hp, carry, carryRes: carryRes || undefined, attackAnim, order: { type: otype, farm: farm || undefined } });
    } else if (k === 'b') {
      const [type, player, x0, z0, done, progress, hp, queue, rally, worker] = a;
      if (!w.has(e, 'Bld')) { const s = BLD[type].size; w.add(e, 'Pos', { x: x0 + s / 2, z: z0 + s / 2 }); w.add(e, 'Owner', { player }); w.add(e, 'Bld', { type, x0, z0 }); occupy(e, type, x0, z0); }
      Object.assign(w.get(e, 'Bld'), { done: !!done, progress, hp, rally, worker, queue: queue.map(([unit, player, t, blocked]) => ({ unit, player, t, blocked: !!blocked })) });
    } else if (k === 'p') {
      const [x, z, tx, tz] = a;
      if (!w.has(e, 'Proj')) w.add(e, 'Proj', { x, z, px: x, pz: z, tx, tz }); else Object.assign(w.get(e, 'Proj'), { x, z, tx, tz });
    } else if (k === 'g') {
      const [player, x, z, ttl, max] = a;
      if (!w.has(e, 'Ping')) { w.add(e, 'Pos', { x, z, px: x, pz: z }); w.add(e, 'Owner', { player }); w.add(e, 'Ping', { ttl, max }); } else w.get(e, 'Ping').ttl = ttl;
    }
  }
  for (const e of m.rm) { if (w.has(e, 'Bld')) unoccupy(e); w.remove(e); selection.delete(e); }
  w.over = m.over;
  if (m.res) w.res = m.res;
  if (m.cells) for (const [c, tile, amount] of m.cells) {
    map.tile[c] = tile; map.amount[c] = amount; map.dirty.push(c);
    const x = c % map.M, z = Math.floor(c / map.M); setWalk(x, z, x + 1, z + 1, tile === T.TREE ? 0 : 1);
  }
  if (m.sap) map.saplings = new Map(m.sap);
  w.tick = m.tick; net.snapT = performance.now(); net.hostPaused = false;
  buildSpatial(w);
}

/* ================= LOOP ================= */
let acc = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dtMs = Math.min(250, now - last); last = now;
  if (state !== 'game') return;
  let alpha;
  if (net.role === 'client') alpha = Math.min(1, (now - net.snapT) / (CFG.TICK_MS * SNAP_EVERY));
  else if (!paused) { acc += dtMs; let n = 0; while (acc >= CFG.TICK_MS && n++ < 5) { simStep(); acc -= CFG.TICK_MS; } if (n >= 5) acc = 0; }
  panCamera(dtMs / 1000);
  updateCamera();
  syncRender(now, alpha ?? (paused ? 1 : Math.min(1, acc / CFG.TICK_MS)));
  renderer.render(scene, cam);
  drawMinimap();
  updateHud(dtMs / 1000);
}

applyLang(); resize(); requestAnimationFrame(frame);
window.__rts = { get world() { return world; }, get map() { return map; }, get nav() { return nav; }, Commands, camState, selection, spawnUnit, UNITS, BLD, placeOk, popCap, popOf, step: n => { for (let i = 0; i < n; i++) simStep(); }, navSelfTest };
// self-check nav (da console in partita): muro temporaneo → percorso lo aggira; cella chiusa → find fallisce subito
function navSelfTest() {
  const b = BASES[0], x = b.x + 8, z0 = b.z - 4, z1 = b.z + 5, ok = (c, m) => { if (!c) throw new Error('navSelfTest: ' + m); };
  const saved = []; for (let z = z0; z < z1; z++) saved.push(map.walk[map.idx(x, z)]);
  setWalk(x, z0, x + 1, z1, 0);
  const path = nav.find(x - 2.5, b.z + .5, x + 3.5, b.z + .5);
  ok(path && path.every(q => Math.floor(q.x) !== x || Math.floor(q.z) < z0 || Math.floor(q.z) >= z1), 'percorso attraversa il muro');
  setWalk(x - 1, b.z - 1, x + 2, b.z + 2, 0); setWalk(x, b.z, x + 1, b.z + 1, 1);    // cella libera chiusa da ogni lato
  nav.comps(); const t0 = performance.now(); ok(!nav.find(x - 2.5, b.z - 4.5, x + .5, b.z + .5) && performance.now() - t0 < 5, 'cella chiusa non scartata subito');
  for (let z = z0 - 1; z < z1 + 1; z++) for (let xx = x - 1; xx <= x + 1; xx++) map.walk[map.idx(xx, z)] = (map.tile[map.idx(xx, z)] === T.GRASS || map.tile[map.idx(xx, z)] === T.FORD) && !map.bld[map.idx(xx, z)] ? 1 : 0;
  nav.rebuildArea(x - 1, z0 - 1, x + 1, z1);
  return 'ok';
}
